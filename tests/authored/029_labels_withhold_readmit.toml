alterant = "Labels"
value = ["y", "z"]
decided_by = ["block@2", "block@5"]
note = "the withholding metaLine's own Line: a child of block@5; its set {y, z} applies indirectly. Provenance: no per-Line row (observed 2026-10-21)"

[[expect]]
component = "line@6"
alterant = "Labels"
value = ["y", "z"]
decided_by = ["block@2", "block@5"]
note = "a plain Line: a child of block@6; the set applies indirectly. Provenance: no per-Line row (observed 2026-10-21)"

[[expect]]
component = "line@7"
alterant = "Labels"
value = ["x", "y", "z"]
decided_by = ["block@2", "block@5", "block@7"]
note = "the explicitly applying metaLine's own Line: a child of block@7; its set applies indirectly. Provenance: no per-Line row (observed 2026-10-21)"

[[expect]]
