scenario = "A metaLine on line 1 adds the label label1. Line 2 (a = 1) carries no meta of its own. A metaLine on line 3, at depth 2 under the depth-1 metaLine, adds the label label2. Line 4 (b = 2) carries no meta of its own. Labels accumulate: Block 1 (the metaBlock of line 1) carries {label1}, by its own metaLine. Block 2 (the Code Block holding line 2) is attached to that meta and therefore inherits {label1}. Block 3 (the metaBlock of line 3) carries {label1, label2}: label1 from the depth-1 metaLine above it in the meta hierarchy, label2 by its own metaLine. Block 4 (the Code Block holding line 4) is attached to that meta and therefore inherits {label1, label2}. Each set applies to its Block and indirectly to that Block's child Line — line 1 {label1}, line 2 {label1}, line 3 {label1, label2}, line 4 {label1, label2}; the Lines are not explicitly issued the labels and did not explicitly inherit them. The File is not stated in this scenario."
