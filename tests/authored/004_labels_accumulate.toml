scenario = "Labels ACCUMULATE (the :accumulate set mode): the outer Block (line 1) adds :label1; the nested Block (line 3) adds :label2 and inherits :label1, so it carries both. Line 2 inherits {label1}; line 4 inherits {label1, label2}."

[[expect]]
