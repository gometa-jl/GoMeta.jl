alterant = "Heading"
value = "Chapter one"
decided_by = "block@1"
note = "the metaBlock opened by the line-1 metaLine; its own heading. Provenance: at ac29037 the one head_1 row was keyed to the metaLine's own Line, not to this Block (observed 2026-09-10), and this statement required a Block-level entry the Engine did not then deliver; since 0.4.0 the row is keyed to this metaBlock and the statement is met"

