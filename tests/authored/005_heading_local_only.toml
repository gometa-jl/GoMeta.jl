scenario = "A metaLine on line 1 states the heading 'Chapter one'. Line 2 (a = 1) carries no meta of its own. A metaLine on line 3, at depth 2, adds a label (not stated in this scenario; labels are scenario 004's). Line 4 (b = 2) carries no meta of its own. Block 1 (the metaBlock of line 1) carries 'Chapter one', by its own metaLine, and the heading applies indirectly to line 1 as Block 1's child. No other Block or Line carries a heading: Block 2 (the Code Block attached to that meta), line 2, Blocks 3 and 4 and lines 3 and 4 carry none. The File is not stated in this scenario."
history = ["2026-09-10: confirmed by the owner on these exact bytes (transaction S5-CONFIRM-005). The truth: his words of 2026-09-10 (OWNER-WORDS §12): 'Chapter one' is applied to the first Block only, that is it — the offered alternative 'The Block the metaLine forms only, no attached or nested Block: block@1 carries the heading; line@1 indirectly; block@2 absent' in substance (the RULINGS row of that date quotes his sentence); the line 1 statement is the session's application of his indirect-application principle (OWNER-WORDS §8 item 3, whose own example is a heading applied to a Block), confirmed by his word on these bytes; that the attached Code Block and the nested Block carry no heading is his 'that is it', which also agrees with the Engine's registered :localOnly set-mode as put to him. At ac29037 the Engine records the heading on the metaLine's own Line (one head_1 row, Line-level); a Block-level heading entry must be ADDED by the Engine for this scenario to pass — an Engine change outside the branch's ruled scope, to be ordered at D-4 or by extending the branch (R-V04B-16 (1)'s proof clause 'the authored scenarios green' then needs the scope extended or the clause amended) — and until then this scenario is expected to FAIL against the Engine. Whether a consumer is told own/direct versus indirect for line 1 is OPEN (D-4); whether the File is a governed Component is OPEN (D-4, catalogue row 21a)."]

