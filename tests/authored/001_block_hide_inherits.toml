component = "block@1"
alterant = "Visib"
value = "hide"
decided_by = "block@1"
note = "the metaBlock opened by the line-1 metaLine; its own value (the creator, 2026-09-10). Provenance: a Block-grain row at 8c3a83d (observed 2026-09-04)"

