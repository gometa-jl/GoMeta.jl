schema = 1
stem = "001_block_hide_inherits"
status = "confirmed"
drafted_by = "a draft of 2026-08-28, restated 2026-09-10 as positions and values in the creator's terms"
confirmed_by = "the creator, 2026-09-10"
scenario = "A metaLine on line 1 says hide. Line 2 (a = 1) carries no meta of its own. Line 3 (b = 2) carries an inline metaSegment saying show. Block 1 (the metaBlock): hide, by its own metaLine. Block 2 (the Code Block holding lines 2 and 3) is attached to that meta and therefore inherits hide. Hide applies to those Blocks and indirectly to their children: line 1 as Block 1's child, line 2 as Block 2's child; the Lines are not explicitly issued hide and did not explicitly inherit it. Line 3: show, since the closest metaStatement wins, in this case the metaSegment at the end of line 3."
history = ["2026-09-10: confirmed by the creator on these exact bytes. The truth: his words of 2026-09-10 on Block 1, Block 2 and Line 3, and his indirect-application principle (general to every Alterant); the line 1 and line 2 statements are the application of that principle, confirmed by his word on these bytes. How the Engine delivers an entry for a child Component is OPEN (the interface is a first crude draft — his lean, not a decision)."]

