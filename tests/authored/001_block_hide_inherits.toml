schema = 1
stem = "001_block_hide_inherits"
status = "draft"
drafted_by = "session S3B, 2026-08-28"
confirmed_by = ""
scenario = "One Block (opened by the #~ hide on line 1) hides. Line 2 carries no meta and inherits hide. Line 3 carries an inline #~ show of its own, which wins over the Block (Line over Block)."

[[expect]]
component = "block@1"
alterant = "Visib"
value = "hide"
decided_by = "block@1"

[[expect]]
component = "line@2"
alterant = "Visib"
value = "hide"
decided_by = "block@1"
note = "inherited — not recorded by the Engine at 85576bf (the boundary finding: only Components that carry meta get a row); expected once D-1 lands"

[[expect]]
component = "line@3"
alterant = "Visib"
value = "show"
decided_by = "line@3"
note = "the Line's own inline verdict wins over the enclosing Block's hide"
