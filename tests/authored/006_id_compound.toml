scenario = "The Id compound at v0.4 — THREE measured behaviours put to the creator (SCENARIOS.md row 16): (1) a metaLine on line 1 sets two fields, cell(7) and parent(3): the metaBlock and the Code Block attached to it carry BOTH fields. (2) A depth-2 metaLine on line 3 sets cell(9) only: its metaBlock and the Code Block attached to it carry cell = 9 and NO parent field — the compound is taken as a WHOLE from the nearest statement; an unset field is NOT inherited from the depth-1 statement (the per-field first-wins semantics the set-mode's name promises are DEFERRED; the registry records them so). (3) A metaLine on line 5 sets cell(0) and parent(5): only parent = 5 is recorded — a ZERO value is indistinguishable from an unset field in the rows (the capture records non-zero fields only). The expectation vocabulary for a compound — an inline table of the recorded fields — is a proposal; README rule 2 leaves Id's per-field form undefined until his word."
history = ["2026-10-01: drafted from the measured printouts; NOT confirmed — a draft has no authority (README rule 3); the three behaviours and the vocabulary are put to the creator."]

