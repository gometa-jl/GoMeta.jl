scenario = "A metaLine on line 1 says discard. Line 2 (a = 1) carries no meta of its own. A metaLine on line 3, at depth 2 under the depth-1 metaLine, says show. Line 4 (b = 2) carries no meta of its own. Block 1 (the metaBlock of line 1): discard, by its own metaLine. Block 2 (the Code Block holding line 2) is attached to that meta and therefore inherits discard. Block 3 (the metaBlock of line 3): show, by its own metaLine; the enclosing depth-1 discard does not prevail over it. Block 4 (the Code Block holding line 4) is attached to that meta and therefore inherits show. Each value applies to its Block and indirectly to that Block's child Line — line 1 discard, line 2 discard, line 3 show, line 4 show; the Lines are not explicitly issued the value and did not explicitly inherit it. The File is not stated in this scenario."
history = ["2026-09-10: confirmed by the creator on these exact bytes; the file renamed from 002_block_discard_no_resurface in the same commit. The truth: his word of 2026-09-10 on the eight statements. The render direction decided on 2026-08-07: an inner show under a Block discard renders — nearest wins; the Block 3 and Block 4 value statements read that direction, confirmed by his word on these bytes; the Line statements apply his indirect-application principle, likewise confirmed. How the Engine delivers an entry for a child Component is OPEN; whether the File is a governed Component is OPEN (catalogue row 21a)."]

