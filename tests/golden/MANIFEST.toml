# tests/golden/MANIFEST.toml — the golden-layer manifest (authority 1).
#
# IS/DOES: the read-side index for the MANIFEST-driven golden runner.
#   3-way partition: byte_identical | expected_to_change | net_new_surface.
# GROUNDING: the behaviour ORACLE is a reference render corpus produced by an earlier
#   implementation. The corpus fixtures (source legacy_harvest) are the examples/ corpus rendered
#   against that reference; this engine reproduces them BYTE-FOR-BYTE on the six
#   newline-terminated files + modulo exactly one trailing 0x0a on JuliaCon (divergence (3) below).
# DIVERGENCES from the reference ((1)/(2): documented, not exercised by this corpus so not asserted
#   here; (3): reconciled here via the input-keyed oracle-parity check):
#   (1) discard component-skip vs the reference finalVisib-precedence (a show-override inside a
#       discard-skipped ancestor is omitted; documented in src/emit/emit.jl) — accept-as-documented;
#   (2) multi-byte segment-slicing: this engine's parse layer is byte-correct on multi-byte
#       segment bounds where the reference truncates;
#   (3) terminal-newline byte-faithfulness: render_bytes is byte-faithful on the WHOLE-FILE terminal
#       newline (output ends 0x0a IFF input does — v0's file-level rule), whereas the reference
#       corpus's writer appends one unconditionally. UNLIKE (1)/(2) this IS reconciled here:
#       JuliaCon's input ends 0x22, so its render ends without a trailing 0x0a — the committed
#       OutFileFolder copy EQUALS the 1656 B render — and the oracle-parity check
#       (golden_tests.jl's drift-check) accepts modulo one trailing 0x0a, keyed on the input's
#       terminal byte. The JuliaCon fixture carries a category-(i) [[fixture.repin]] row.
# Missing-key policy: required keys missing => HARD test error (fail-closed). Only optional: annotations golden.
# Append-only: rows are NEVER rewritten; a re-pin adds a [[fixture.repin]] row. (ONE dispositioned
#   exception: the constructed rr48 rows' input_path values moved in place for the
#   git-mv relocation corpus/ -> constructed/ — shas untouched; tool-emitted since.)

schema_version = 1
oracle = "reference-render-corpus"
oracle_corpus = "examples (InFileFolder = single source of truth; OutFileFolder = reference)"
